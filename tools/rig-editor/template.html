<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spritekit · skeleton rig editor</title>
<style>
  :root { --bg:#0e0f13; --panel:#171922; --ink:#e8e8ee; --mut:#9aa0b0; --acc:#5ac8ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }
  header { padding:10px 14px; background:var(--panel); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  header b { color:var(--acc); }
  .wrap { display:flex; gap:14px; padding:14px; flex-wrap:wrap; }
  .stage { background:#11131a; border:1px solid #262a38; border-radius:8px; padding:10px; overflow:auto; max-width:100%; }
  canvas { image-rendering:pixelated; cursor:crosshair; touch-action:none; display:block; }
  .side { width:330px; max-width:100%; display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--panel); border:1px solid #262a38; border-radius:8px; padding:10px; }
  label { color:var(--mut); font-size:12px; }
  select, input, button { background:#0f1117; color:var(--ink); border:1px solid #2c3142; border-radius:6px; padding:6px 8px; font:inherit; }
  button { cursor:pointer; }
  button.acc { background:var(--acc); color:#04222e; border:none; font-weight:600; }
  button:hover { filter:brightness(1.1); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  textarea { width:100%; height:260px; background:#0b0c10; color:#bfe6ff; border:1px solid #2c3142; border-radius:6px; font:12px/1.4 ui-monospace,monospace; padding:8px; }
  .hint { color:var(--mut); font-size:12px; }
  .pill { background:#0f1117; border:1px solid #2c3142; border-radius:999px; padding:2px 8px; font-size:12px; color:var(--acc); }
  kbd { background:#222634; border-radius:4px; padding:1px 5px; font-size:11px; }
</style>
</head>
<body>
<header>
  <b>spritekit</b> · skeleton rig editor
  <span class="pill" id="posePill">—</span>
  <span class="hint">drag the labelled joints onto the body · changes export below</span>
</header>

<div class="wrap">
  <div class="stage"><canvas id="cv"></canvas></div>

  <div class="side">
    <div class="card">
      <div class="row">
        <label>sprite/pose</label>
        <select id="sel"></select>
      </div>
      <div class="row" style="margin-top:8px">
        <label>zoom</label><input id="scale" type="range" min="6" max="22" value="13">
        <label><input id="grid" type="checkbox" checked> grid</label>
        <label><input id="snap" type="checkbox" checked> snap</label>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="hint">selected: <b id="selJoint">—</b> <span id="selXY"></span></span>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="reset">reset pose</button>
        <button id="nudgeInfo" title="arrow keys nudge the selected joint">arrows = nudge</button>
      </div>
    </div>

    <div class="card">
      <label>load your own sprite to rig</label>
      <div class="row" style="margin-top:6px">
        <input id="file" type="file" accept="image/png,image/jpeg">
      </div>
      <div class="row" style="margin-top:6px">
        <label>native W</label><input id="nw" type="number" value="32" style="width:64px">
        <label>H</label><input id="nh" type="number" value="48" style="width:64px">
        <button id="addImg">rig this</button>
      </div>
      <div class="hint">native = the real low-res pixel grid (e.g. 32×48). The image is downscaled to that to rig on.</div>
    </div>

    <div class="card">
      <div class="row">
        <button class="acc" id="copy">copy rig JSON</button>
        <button id="download">download rig.json</button>
      </div>
      <div class="hint" style="margin:6px 0">Paste this back to Claude — or download &amp; send the file.</div>
      <textarea id="out" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<script>
const DATA = __RIG_EDITOR_DATA__;
const rig = DATA.rig;
const targets = DATA.sprites.slice();   // {name,w,h,src,pose}
const imgs = {};                        // pose -> HTMLImageElement
const MARGIN = 22;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const sel = document.getElementById('sel'), out = document.getElementById('out');
let cur = 0, scale = 13, dragging = null, selected = null;

function curTarget(){ return targets[cur]; }
function curPose(){ return curTarget().pose; }
function joints(){ return rig.poses[curPose()]; }

function colLabel(n){ let s=''; n+=1; while(n){ let r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26);} return s; }

function loadImg(t){ return new Promise(res=>{ if(imgs[t.pose]) return res(imgs[t.pose]);
  const im=new Image(); im.onload=()=>{imgs[t.pose]=im; res(im);}; im.src=t.src; }); }

function fillSelect(){ sel.innerHTML=''; targets.forEach((t,i)=>{ const o=document.createElement('option');
  o.value=i; o.textContent=`${t.name}  (${t.w}×${t.h}, pose ${t.pose})`; sel.appendChild(o); }); sel.value=cur; }

async function draw(){
  const t=curTarget(); const im=await loadImg(t);
  const W=MARGIN+t.w*scale, H=MARGIN+t.h*scale;
  cv.width=W; cv.height=H;
  ctx.fillStyle='#11131a'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#171922'; ctx.fillRect(MARGIN,MARGIN,t.w*scale,t.h*scale);
  ctx.imageSmoothingEnabled=false;
  if(im) ctx.drawImage(im,MARGIN,MARGIN,t.w*scale,t.h*scale);
  if(document.getElementById('grid').checked){
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.fillStyle='#8b93a7'; ctx.font='10px monospace'; ctx.lineWidth=1;
    const step = t.w>40?4:2;
    for(let x=0;x<=t.w;x+=step){ const px=MARGIN+x*scale+.5; ctx.beginPath();ctx.moveTo(px,MARGIN);ctx.lineTo(px,H);ctx.stroke(); if(x<t.w) ctx.fillText(colLabel(x),px+1,12);}
    for(let y=0;y<=t.h;y+=step){ const py=MARGIN+y*scale+.5; ctx.beginPath();ctx.moveTo(MARGIN,py);ctx.lineTo(W,py);ctx.stroke(); if(y<t.h) ctx.fillText(y,2,py+10);}
  }
  const J=joints(), c=p=>[MARGIN+p[0]*scale+scale/2, MARGIN+p[1]*scale+scale/2];
  ctx.strokeStyle='#5ac8ff'; ctx.lineWidth=Math.max(1,scale/5);
  rig.bones.forEach(([a,b])=>{ if(J[a]&&J[b]){ const A=c(J[a]),B=c(J[b]); ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke(); }});
  const r=Math.max(4,scale*0.42);
  for(const name in J){ const [sx,sy]=c(J[name]); const head=name==='head'||name==='head_top';
    ctx.fillStyle = name===selected ? '#fff' : (head?'#ff6e6e':'#ffd23c');
    ctx.strokeStyle='#0a0a0a'; ctx.lineWidth=1.5; ctx.beginPath();ctx.arc(sx,sy,r,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='11px monospace'; ctx.fillText(abbr(name), sx+r, sy-r); }
  document.getElementById('posePill').textContent=curPose();
  writeOut();
}
const ABBR={head_top:'ht',head:'hd',neck:'nk',shoulder_l:'sL',shoulder_r:'sR',elbow_l:'eL',elbow_r:'eR',hand_l:'hL',hand_r:'hR',pelvis:'pv',hip_l:'pL',hip_r:'pR',knee_l:'kL',knee_r:'kR',foot_l:'fL',foot_r:'fR'};
function abbr(n){ return ABBR[n]||n.slice(0,2); }

function nativeFromEvent(e){ const rct=cv.getBoundingClientRect();
  const mx=(e.clientX-rct.left)*(cv.width/rct.width), my=(e.clientY-rct.top)*(cv.height/rct.height);
  return [ (mx-MARGIN)/scale, (my-MARGIN)/scale, mx, my ]; }

function pick(mx,my){ const J=joints(); let best=null,bd=1e9;
  for(const n in J){ const sx=MARGIN+J[n][0]*scale+scale/2, sy=MARGIN+J[n][1]*scale+scale/2;
    const d=(sx-mx)**2+(sy-my)**2; if(d<bd){bd=d;best=n;} }
  return bd<=(scale*1.4)**2 ? best : null; }

function setJoint(n,nx,ny){ const t=curTarget(); const snap=document.getElementById('snap').checked;
  nx=Math.max(0,Math.min(t.w-1, snap?Math.floor(nx):nx)); ny=Math.max(0,Math.min(t.h-1, snap?Math.floor(ny):ny));
  joints()[n]=[Math.round(nx),Math.round(ny)]; }

cv.addEventListener('pointerdown',e=>{ const [nx,ny,mx,my]=nativeFromEvent(e); const n=pick(mx,my);
  if(n){ selected=n; dragging=n; cv.setPointerCapture(e.pointerId); setJoint(n,nx,ny); refresh(); } });
cv.addEventListener('pointermove',e=>{ if(!dragging) return; const [nx,ny]=nativeFromEvent(e); setJoint(dragging,nx,ny); refresh(); });
cv.addEventListener('pointerup',()=>{ dragging=null; });
window.addEventListener('keydown',e=>{ if(!selected) return; const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(d){ e.preventDefault(); const J=joints(); setJoint(selected,J[selected][0]+d[0],J[selected][1]+d[1]); refresh(); } });

function refresh(){ const J=joints();
  document.getElementById('selJoint').textContent=selected||'—';
  document.getElementById('selXY').textContent = selected? `→ ${J[selected][0]},${J[selected][1]} (${colLabel(J[selected][0])}${J[selected][1]})` : '';
  draw(); }
function writeOut(){ out.value=JSON.stringify(rig,null,2); }

document.getElementById('scale').oninput=e=>{ scale=+e.target.value; draw(); };
document.getElementById('grid').onchange=draw;
sel.onchange=e=>{ cur=+e.target.value; selected=null; refresh(); };
document.getElementById('reset').onclick=()=>{ if(DATA.rig0.poses[curPose()]){ rig.poses[curPose()]=JSON.parse(JSON.stringify(DATA.rig0.poses[curPose()])); refresh(); } };
document.getElementById('copy').onclick=()=>{ navigator.clipboard?.writeText(out.value); };
document.getElementById('download').onclick=()=>{ const b=new Blob([out.value],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='rig.json'; a.click(); };

document.getElementById('addImg').onclick=()=>{ const f=document.getElementById('file').files[0];
  const w=+document.getElementById('nw').value, h=+document.getElementById('nh').value;
  if(!f||!w||!h){ alert('choose an image and native W/H'); return; }
  const rd=new FileReader(); rd.onload=()=>{ const pose='custom_'+(targets.length);
    rig.poses[pose]=defaultPose(w,h); targets.push({name:f.name,w,h,src:rd.result,pose});
    fillSelect(); cur=targets.length-1; sel.value=cur; selected=null; refresh(); };
  rd.readAsDataURL(f); };

function defaultPose(w,h){ const cx=Math.round(w/2); const Y=v=>Math.round(h*v);
  return { head_top:[cx,Y(.28)], head:[cx,Y(.38)], neck:[cx,Y(.46)],
    shoulder_l:[cx-3,Y(.48)], shoulder_r:[cx+3,Y(.48)], elbow_l:[cx-4,Y(.55)], elbow_r:[cx+4,Y(.55)],
    hand_l:[cx-5,Y(.6)], hand_r:[cx+5,Y(.6)], pelvis:[cx,Y(.68)],
    hip_l:[cx-2,Y(.7)], hip_r:[cx+2,Y(.7)], knee_l:[cx-2,Y(.82)], knee_r:[cx+2,Y(.82)],
    foot_l:[cx-2,Y(.95)], foot_r:[cx+2,Y(.95)] }; }

fillSelect(); refresh();
</script>
</body>
</html>
